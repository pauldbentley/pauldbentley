<!DOCTYPE html>

<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header>
    {{ partial "header.html" . }}
    {{ block "header" . }}{{ end }}
  </header>
  {{ block "main" . }}{{ end }}
  <footer class="px-4 py-5 p-md-5 text-white bg-dark">
    {{ partial "footer.html" . }}
  </footer>
  <img src="/assets/img/grunge-7084937.svg" class="position-absolute top-0 start-50 w-75 translate-middle z-n1 d-none" style="opacity: 0.1;">
</body>
</html>
