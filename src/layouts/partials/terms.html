{{- $page := .page }}
{{- $taxonomy := .taxonomy }}

{{- with $page.GetTerms $taxonomy }}
  {{- $label := (index . 0).Parent.LinkTitle }}
  <div>
    <h5>{{ $label }}</div>
    {{- range . }}
      <a class="btn btn-outline-secondary btn-sm" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{- end }}
  </div>
{{- end }}
